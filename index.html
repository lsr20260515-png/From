<!DOCTYPE html>
<html lang="zh-CN">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>音乐与电影场景</title>

<style>
body {
    font-family: Arial, "Microsoft YaHei", sans-serif;
    text-align: center;
    padding: 40px 20px;
    background: #f7f3ea;
}

h1 {
    font-size: 28px;
    margin-bottom: 20px;
}

p {
    font-size: 19px;
    line-height: 1.6;
}

audio {
    width: 100%;
    max-width: 400px;
    margin: 25px 0;
}

h2 {
    font-size: 21px;
    line-height: 1.6;
    margin-top: 25px;
}

.options {
    max-width: 500px;
    margin: 20px auto;
    text-align: left;
}

.option {
    background: white;
    border-radius: 10px;
    padding: 15px;
    margin: 12px 0;
    font-size: 18px;
}
</style>

</head>

<body>

<h1>🎬 音乐与电影场景</h1>

<p>请仔细聆听这段音乐！</p>

<audio controls>
    <source src="From the New World.mp3" type="audio/mpeg">
    您的浏览器不支持音频播放。
</audio>

<h2>
B10. 如果把这段音乐作为电影配乐，<br>
最符合下面哪个场景？
</h2>

<div class="options">

    <div class="option">A. 赛车最后冲刺</div>

    <div class="option">B. 主角站在山顶眺望遥远的故乡</div>

    <div class="option">C. 战争爆发</div>

    <div class="option">D. 欢乐的生日派对</div>

</div>

</body>
</html>
